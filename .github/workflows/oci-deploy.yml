name: Deploy kyodoku to Oracle Cloud

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Optional tag to deploy; defaults to the commit SHA"
        required: false
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.OCIR_REPO }}/kyodoku-bot

jobs:
  build-and-push:
    name: Build and push container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCIR_REGION }}.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.bot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Prepare target directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || '22' }}
          script_stop: true
          script: |
            mkdir -p /opt/kyodoku

      - name: Copy compose file to target host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || '22' }}
          source: infra/docker/docker-compose.deploy.yml
          target: /opt/kyodoku/docker-compose.deploy.yml

      - name: Deploy bot container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            IMAGE_TAG=${{ github.event.inputs.image-tag }}
            if [ -z "$IMAGE_TAG" ]; then
              IMAGE_TAG=${GITHUB_SHA}
            fi
            IMAGE="${{ env.IMAGE_NAME }}:$IMAGE_TAG"
            mkdir -p /opt/kyodoku
            cd /opt/kyodoku
            docker login ${{ secrets.OCIR_REGION }}.ocir.io \
              -u "${{ secrets.OCIR_USERNAME }}" \
              -p "${{ secrets.OCIR_PASSWORD }}"
            docker pull "$IMAGE"
            KYODOKU_IMAGE="$IMAGE" docker compose -f docker-compose.deploy.yml up -d bot
