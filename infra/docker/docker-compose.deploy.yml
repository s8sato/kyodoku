version: "3.8"

services:
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kyodoku
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6
    restart: unless-stopped

  bot:
    image: ${KYODOKU_IMAGE:?Set KYODOKU_IMAGE to the OCI image tag (e.g., iad.ocir.io/tenancy/kyodoku-bot:latest)}
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  db-data:
