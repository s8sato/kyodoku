app = "kyodoku-bot"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "../docker/Dockerfile.bot"

[env]
  RUST_LOG = "info"
  VOICE_CLEANUP_DELAY_SECONDS = "60"
  TEXT_CHANNEL_CAPACITY = "150"
  ARCHIVE_POLL_INTERVAL_SECONDS = "86400"
  ARCHIVE_GRACE_PERIOD_SECONDS = "5184000"
  WATCHLIST_LIMIT = "30"

[processes]
  bot = "kyodoku-bot"

[[vm]]
  size = "shared-cpu-1x"
  processes = ["bot"]
