app = "kyodoku-bot"
primary_region = "nrt"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "../docker/Dockerfile.bot"

[env]
  RUST_LOG = "info"
  VOICE_CLEANUP_DELAY_SECONDS = "60"
  TEXT_ACTIVITY_EVAL_INTERVAL_SECONDS = "86400"
  TEXT_CATEGORY_SWAP_COUNT = "10"
  TEXT_CATEGORY_PRUNE_COUNT = "10"
  WATCHLIST_LIMIT = "30"

[processes]
  bot = "kyodoku-bot"

[[vm]]
  size = "shared-cpu-1x"
  processes = ["bot"]
